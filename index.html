<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veluxe Legacy Group — Project Documents</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0d0d; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { max-width: 600px; padding: 60px 40px; text-align: center; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #c9a84c; margin-bottom: 20px; display: block; }
  h1 { font-size: 32px; font-weight: 300; margin-bottom: 12px; }
  h1 span { color: #c9a84c; font-weight: 600; }
  p { font-size: 15px; color: rgba(255,255,255,0.45); margin-bottom: 48px; }
  .docs { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .doc-link { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border: 1px solid rgba(201,168,76,0.2); border-radius: 4px; text-decoration: none; color: #fff; transition: all 0.2s; }
  .doc-link:hover { border-color: rgba(201,168,76,0.6); background: rgba(201,168,76,0.05); }
  .doc-link .doc-name { font-size: 15px; font-weight: 500; }
  .doc-link .doc-date { font-size: 12px; color: rgba(255,255,255,0.35); }
  .arrow { color: #c9a84c; font-size: 18px; }
  .footer { margin-top: 48px; font-size: 12px; color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">Client Project</span>
  <h1>Veluxe <span>Legacy Group</span></h1>
  <p>Project documents, scope reviews, and change requests.</p>
  <div class="docs">
    <a href="scope/" class="doc-link">
      <div>
        <div class="doc-name">Scope Understanding & Questions</div>
        <div class="doc-date">May 30, 2025 — Website Redesign</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
  <div class="footer">faisalahmadkhan.github.io/veluxe.com</div>
</div>
</body>
</html>
